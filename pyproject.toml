[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tlqldmr"
version = "0.1.0"
description = "Fixed-feature TL-QLDMR transfer quantile regression and experiment configurations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<2"]

[project.scripts]
tlqldmr = "tlqldmr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
